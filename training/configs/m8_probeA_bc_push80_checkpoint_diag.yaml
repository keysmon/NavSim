behaviors:
  RampAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      shared_critic: false
      learning_rate_schedule: linear
      beta_schedule: linear
      epsilon_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple
      memory:
        sequence_length: 64
        memory_size: 128
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    behavioral_cloning:
      demo_path: NavSim/Assets/Demonstrations/M8RampPush80.demo
      strength: 0.3
      steps: 150000
      batch_size: 512
      num_epoch: 3
      samples_per_update: 0
    keep_checkpoints: 4
    checkpoint_interval: 50000
    max_steps: 160000
    time_horizon: 64
    summary_freq: 10000
    threaded: false
environment_parameters:
  arm_mode: 0.0
  ramp_difficulty: 0.0
